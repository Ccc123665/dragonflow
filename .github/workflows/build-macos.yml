name: Build macOS App

# PyInstaller 不能跨平台编译，macOS 版只能在 macOS 机器上打。
# 这里用 GitHub 托管的 macOS runner 出包，推 tag（v*）时自动挂到 Release。
on:
  workflow_dispatch:          # 手动触发，随时出包
  push:
    tags: ["v*"]              # 打 tag 才发 Release，日常 push 不打扰

permissions:
  contents: write             # Release 需要写权限

jobs:
  build:
    name: macOS · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 现在是 macOS 15（Apple Silicon / arm64）
          - runner: macos-15
            arch: arm64
          # Intel 机最后可用的 x86_64 镜像（GitHub 计划 2027-08 下线）
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "PyQt6>=6.5" "PyQt6-WebEngine>=6.5" "pyinstaller>=6.0" \
            "Pillow>=10.0" "requests>=2.31" "edge-tts>=6.1" \
            "imageio-ffmpeg>=0.4.9" "python-docx>=1.1"

      - name: 生成 .icns 图标
        run: |
          python build/make_icns.py
          iconutil -c icns build/icon.iconset -o src/assets/app.icns

      - name: 打包 .app
        run: |
          python -m PyInstaller --noconfirm \
            --distpath dist --workpath build/pyi \
            build/dragonflow-macos.spec

      - name: 压缩产物（zip + dmg）
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            DragonFlow.app "DragonFlow-macos-${{ matrix.arch }}.zip"
          hdiutil create -volname "DragonFlow" \
            -srcfolder DragonFlow.app -ov -format UDZO \
            "DragonFlow-macos-${{ matrix.arch }}.dmg"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DragonFlow-macos-${{ matrix.arch }}
          path: |
            dist/DragonFlow-macos-${{ matrix.arch }}.zip
            dist/DragonFlow-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
